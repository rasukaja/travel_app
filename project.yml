# Optional: generates a Waypoint.xcodeproj from this file using XcodeGen
# (https://github.com/yonaskolb/XcodeGen), instead of creating the Xcode
# project by hand. See docs/GUIDE.md, Part 4, for both options.
#
#   brew install xcodegen
#   xcodegen generate
#   open Waypoint.xcodeproj
name: Waypoint
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Waypoint:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Waypoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Waypoint
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
  WaypointTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/WaypointTests
    dependencies:
      - target: Waypoint
schemes:
  Waypoint:
    build:
      targets:
        Waypoint: all
        WaypointTests: [test]
    test:
      targets:
        - WaypointTests
    run:
      config: Debug
