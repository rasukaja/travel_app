name: Build & Test

# Verifies the app actually compiles and its unit tests pass, on a real
# macOS + Xcode runner — the same toolchain you'd use locally. This can't
# install anything on a physical iPhone (that needs your own Mac + device),
# but it does prove the code in this repo builds cleanly before you ever
# open Xcode yourself.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Find a usable iPhone simulator
        id: sim
        run: |
          name=$(xcrun simctl list devices available -j \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
for runtime, devices in data['devices'].items():
    if 'iOS' not in runtime:
        continue
    for d in devices:
        if d['name'].startswith('iPhone'):
            print(d['name'])
            sys.exit(0)
")
          echo "Using simulator: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -project Waypoint.xcodeproj \
            -scheme Waypoint \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            CODE_SIGNING_ALLOWED=NO
