name: Deploy Waypoint PWA to GitHub Pages

on:
  push:
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Pages isn't enabled on this repo yet; let the action enable it
          # (with build source = GitHub Actions) using the workflow's own
          # token instead of requiring a manual Settings click first.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No `environment: github-pages` block here on purpose: GitHub
    # auto-creates that environment with a "deployment branches" rule
    # restricted to the default branch, which would block deploys from
    # this feature branch. deploy-pages doesn't require a declared
    # environment to publish — only the pages/id-token permissions above.
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
